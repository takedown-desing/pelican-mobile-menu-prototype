<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Flight Training — мобильное меню, сравнение</title>
<style>
  :root{ --dark:#1C1C1C; --gold:#EBA044; --line:#e6e6e6; --muted:#6b6b6b; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:#eef0f3;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1C1C1C;line-height:1.5}
  .top{max-width:1060px;margin:0 auto;padding:22px 18px 8px}
  .top h1{font-size:22px;margin:0 0 6px;font-weight:700}
  .top p{margin:0 0 12px;color:var(--muted);font-size:14px;max-width:680px}
  .sw{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
  .sw button{border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--muted);
    padding:9px 16px;border-radius:999px;cursor:pointer}
  .sw button.on{background:var(--dark);color:#fff}
  .note{max-width:1060px;margin:10px auto 0;padding:0 18px;font-size:13px;color:var(--muted)}
  .note b{color:#1C1C1C}
  .stage{display:flex;justify-content:center;padding:14px 18px 40px}
  .phone{width:390px;height:800px;background:#fff;border-radius:36px;overflow:hidden;position:relative;
    box-shadow:0 18px 50px rgba(0,0,0,.20);border:10px solid #111}
  .phone iframe{width:100%;height:100%;border:0;display:block}
  .phone iframe.hide{display:none}
  @media(max-width:560px){
    .top{padding:14px 14px 6px} .top h1{font-size:18px}
    .stage{padding:8px 0 20px}
    .phone{width:100%;height:84vh;border-radius:0;border:0;box-shadow:none}
  }
  .hint{max-width:1060px;margin:0 auto 34px;padding:0 18px}
  .hint div{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;
    padding:13px 15px;font-size:13.5px;color:#444;line-height:1.55}
  .hint b{color:#1C1C1C}
  .open-new{max-width:1060px;margin:0 auto 26px;padding:0 18px;font-size:13px}
  .open-new a{color:#1C1C1C}
</style>
</head>
<body>

<div class="top">
  <h1>Мобильное меню: как сейчас и как предлагаем</h1>
  <p>В первом режиме внутри рамки открыт настоящий сайт, во втором предлагаемый вариант на тех же шрифтах, цветах и таблицах. Откройте меню кнопкой в шапке телефона.</p>
  <div class="sw">
    <button id="b1" onclick="setMode('old')">Как сейчас (живой сайт)</button>
    <button id="b2" class="on" onclick="setMode('new')">Как предлагаем</button>
  </div>
</div>
<div class="note" id="note"></div>

<div class="stage">
  <div class="phone">
    <iframe id="live" class="hide" title="Живой сайт Pelican" src="about:blank"></iframe>
    <iframe id="proto" title="Предлагаемое меню" src="new-menu.html"></iframe>
  </div>
</div>

<div class="hint"><div id="hint"></div></div>
<div class="open-new">Прототип меню отдельной страницей, удобно открыть на телефоне: <a href="new-menu.html">new-menu.html</a></div>

<script>
function setMode(m){
  var live=document.getElementById('live'), proto=document.getElementById('proto');
  document.getElementById('b1').classList.toggle('on', m==='old');
  document.getElementById('b2').classList.toggle('on', m==='new');
  if(m==='old'){
    if(live.src.indexOf('about:blank')>-1) live.src='https://pelicanflightschool.com/programs-courses/';
    live.classList.remove('hide'); proto.classList.add('hide');
  }else{
    proto.src='new-menu.html';           /* перезагрузим, чтобы меню было закрыто */
    proto.classList.remove('hide'); live.classList.add('hide');
  }
  document.getElementById('note').innerHTML = (m==='old')
    ? 'Внутри рамки <b>настоящий сайт</b>, а не макет. Нажмите кнопку меню слева вверху и откройте раздел Training.'
    : 'Тот же контент и те же шрифты, цвета и таблицы сайта. Изменено только меню.';
  document.getElementById('hint').innerHTML = (m==='old')
    ? '<b>Что увидите.</b> Панель меню занимает 206px из 390px экрана, а сама ссылка внутри всего 102px. Слово Admissions в 102px не помещается, поэтому рвётся на Admissi и ons. В разделе Training подпункт How to Become a Commercial Pilot превращается в лесенку из слогов. Высота строки 26px при рекомендованных 44px. Цифры сняты замером на этом экране, это не оценка на глаз.'
    : '<b>Что изменилось.</b> Меню занимает экран целиком, поэтому переносов по буквам нет в принципе: шрифт 16px, строка 54px, подпункт 48px. Добавлены поиск и кнопки Apply Now и WhatsApp, которых в мобильном меню не было вообще. Наверх вынесены три страницы, которые приносят заявки. Все 7 разделов и 30 подпунктов на месте, ссылки рабочие и ведут на настоящий сайт. Таблица прайса убрана в горизонтальный скролл, поэтому больше не растягивает страницу. Закрытие: крестик, тап по затемнению, клавиша Esc.';
}
setMode('new');
if((location.hash||'').toLowerCase().indexOf('old')>-1) setMode('old');
</script>
</body>
</html>
